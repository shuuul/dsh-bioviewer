name: CI

# One cheap Linux job on pull requests. Hooks are the primary gate
# (`.husky/pre-push` runs the same `verify:fast`), so there is deliberately no
# `push` duplicate, no schedule and no OS/version matrix here.
# Markdown-only PRs run too: the shared gate validates tracked specs.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.4-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-1.4.4-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Check specs, lint, typecheck, build and test
        run: bun run verify:fast
